# NNLOJET process registry — one entry per driver/maple/makeproc dispatch branch.
#
#   makeproc_iprocess : dispatch number in driver/maple/makeproc (elif(iprocess = N)then)
#   imapprocess       : number in maple/iprocess.map (0 = no subtraction-dir link);
#                       consumed ONLY by makecheck() — it indexes iprocess.map, NOT makeproc.
#   maple             : maple/process/<...>  (subtraction-term .map sources; null = the
#                       mymapdir declared in makeproc does not exist on disk)
#   driver            : driver/process/<...> (generated driver files; null = dir absent)
#   src               : src/process/<...>    (matrix-element Fortran; "shared" comments mark
#                       families reusing another process's MEs; null = no dir found)
#
# NOTE: test/layer_check/databases/proc_folder_db.yml is the layer_check tool's own copy of
# the maple/driver folder mapping — keep the two files in sync when adding processes.
# All folders below were verified against the working copy on 2026-08-05.

